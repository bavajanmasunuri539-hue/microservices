name: Build and Publish Images to Nexus

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api
          - backend
          - frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: 18.xx.xx.xx:8083
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}


      - name: Build Docker Image
        run: |
          docker build \
          -t 18.xx.xx.xx:8083/microservices/${{ matrix.service }}:latest \
          ./${{ matrix.service }}


      - name: Push Docker Image
        run: |
          docker push \
          18.xx.xx.xx:8083/microservices/${{ matrix.service }}:latest
